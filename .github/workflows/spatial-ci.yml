name: Spatial CI

on:
  push:
    paths:
      - "plugin-flink-transform-spatial/**"
      - "waterdrop-flink-api/**"
      - "waterdrop-common/**"
      - "waterdrop-config/**"
      - "waterdrop-apis/**"
      - "pom.xml"
      - ".github/workflows/spatial-ci.yml"
  pull_request:
    paths:
      - "plugin-flink-transform-spatial/**"
      - "waterdrop-flink-api/**"
      - "waterdrop-common/**"
      - "waterdrop-config/**"
      - "waterdrop-apis/**"
      - "pom.xml"
      - ".github/workflows/spatial-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: spatial-module-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Test plugin-flink-transform-spatial
        run: mvn -B -pl plugin-flink-transform-spatial -am test -Dskip.pmd.check=true

      - name: Micro-benchmark (1k polys × 1M points)
        run: >
          mvn -B -pl plugin-flink-transform-spatial
          -Dtest=SpatialBroadcastJoinMicroBenchmark
          -Dsurefire.failIfNoSpecifiedTests=false
          test
