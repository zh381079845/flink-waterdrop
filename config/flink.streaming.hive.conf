######
###### This config file demonstrates Flink Streaming data to Hive using Waterdrop
######

env {
  # Flink configuration
  execution.parallelism = 2
  execution.checkpoint.interval = 60000
  job.name = "kafka-to-hive-example"
}

source {
  # Read from Kafka
  KafkaTableStream {
    topics = "example-topic"
    consumer.bootstrap.servers = "kafka:9092"
    consumer.group.id = "waterdrop-hive-group"
    format.type = "json"
    schema = """
    {
      "fields": [
        {"name": "id", "type": "string"},
        {"name": "name", "type": "string"},
        {"name": "value", "type": "double"},
        {"name": "event_time", "type": "timestamp"}
      ]
    }
    """
    result_table_name = "kafka_data"
  }
}

transform {
  # Transform data and compute partition fields
  Sql {
    sql = """
      SELECT 
        id, 
        name, 
        value, 
        event_time, 
        DATE_FORMAT(event_time, 'yyyy-MM-dd') as dt,
        HOUR(event_time) as hour
      FROM kafka_data
    """
    result_table_name = "partitioned_data"
  }
}

sink {
  # Write to Hive
  HiveSink {
    hive_conf_dir = "/etc/hive/conf"
    database = "default"
    table = "metrics_data"
    metastore_uri = "thrift://hive-metastore:9083"
    
    # Partition configuration
    partition_fields = "dt,hour"
    
    # Write mode (append or overwrite)
    overwrite = false
    
    # Performance tuning
    parallelism = 2
    
    # Source table to read from
    source_table_name = "partitioned_data"
  }
  
  # Optional: also write to console for debugging
  ConsoleSink {}
} 