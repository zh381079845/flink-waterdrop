######
###### 这个配置文件展示了如何在Waterdrop批处理模式中使用空间UDF函数
######

env {
  # You can set flink configuration here
  execution.parallelism = 1
  job.name="batch-jdbc-test"
}

source {
  # 使用CSV文件源，假设有一个包含空间数据的CSV文件
  FileSource {
    path = "/Users/zhanghongmac/Downloads/flink-waterdrop/config/spatial_data.csv"
    format.type = "csv"
    schema = "[{\"type\":\"Int\"},{\"type\":\"string\"},{\"type\":\"string\"}]"
    result_table_name = "spatial_data"
    field_name = "id,name,geometry"
  }
}

transform {
  # 注册空间UDF函数
  SpatialUdfRegister {
    buffer_udf_name = "st_buffer" # 可选，默认为"st_buffer"
  }
  
  # 使用SQL调用空间UDF函数
  sql {
    source_table_name = "spatial_data"
    result_table_name = "result_table"
    sql = """
      SELECT 
        id,
        name,
        geometry AS original_geometry,
        st_buffer(geometry, 1000) AS buffered_geometry_1km,
        st_buffer(geometry, 5000) AS buffered_geometry_5km
      FROM spatial_data
    """
  }
}

sink {
  # 将结果输出到控制台
  ConsoleSink {}
} 