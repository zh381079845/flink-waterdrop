# 生态保护红线面积检查配置示例
source {
  # 假设我们从文件读取空间数据
  FileSource {
    path = "file://./data/spatial_data.csv"
    format = "csv"
    result_table_name = "spatial_data"
  }
  
  # 假设我们从另一个文件读取规划指标数据
  FileSource {
    path = "file://./data/planning_indicators.csv"
    format = "csv"
    result_table_name = "planning_indicators"
  }
}

transform {
  # 注册空间UDF函数。st_area 默认按 WGS84 椭球计算，单位平方米
  SpatialUdfRegister {}
  
  # 计算生态保护红线图层面积
  Sql {
    source_table_name = "spatial_data"
    result_table_name = "ecological_area_stats"
    sql = """
      SELECT 
        'ecological' as layer_type,
        SUM(st_area(geom)) as total_area
      FROM spatial_data 
      WHERE layer_name = '生态保护红线'
    """
  }
  
  # 计算永久基本农田图层面积
  Sql {
    source_table_name = "spatial_data"
    result_table_name = "farmland_area_stats"
    sql = """
      SELECT 
        'farmland' as layer_type,
        SUM(st_area(geom)) as total_area
      FROM spatial_data 
      WHERE layer_name = '永久基本农田'
    """
  }
  
  # 计算各类建设用地图层面积
  Sql {
    source_table_name = "spatial_data"
    result_table_name = "construction_area_stats"
    sql = """
      SELECT 
        'construction' as layer_type,
        layer_name,
        SUM(st_area(geom)) as total_area
      FROM spatial_data 
      WHERE layer_name IN ('城镇建设用地', '村庄建设用地', '区域基础设施用地', '其他建设用地')
      GROUP BY layer_name
    """
  }
  
  # 计算耕地图层面积
  Sql {
    source_table_name = "spatial_data"
    result_table_name = "farmland_polygon_stats"
    sql = """
      SELECT 
        'farmland_polygon' as layer_type,
        SUM(st_area(geom)) as total_area
      FROM spatial_data 
      WHERE layer_name = '耕地'
    """
  }
  
  # 检查生态保护红线面积是否满足要求
  Sql {
    source_table_name = "ecological_area_stats,planning_indicators"
    result_table_name = "ecological_validation_result"
    sql = """
      SELECT 
        e.layer_type,
        e.total_area as calculated_area,
        p.ecological_area_indicator as required_area,
        e.total_area >= p.ecological_area_indicator as is_valid
      FROM ecological_area_stats e
      JOIN planning_indicators p ON p.layer_type = 'ecological'
      WHERE e.total_area < p.ecological_area_indicator
    """
  }
  
  # 检查永久基本农田面积是否满足要求
  Sql {
    source_table_name = "farmland_area_stats,planning_indicators"
    result_table_name = "farmland_validation_result"
    sql = """
      SELECT 
        f.layer_type,
        f.total_area as calculated_area,
        p.farmland_area_indicator as required_area,
        f.total_area >= p.farmland_area_indicator as is_valid
      FROM farmland_area_stats f
      JOIN planning_indicators p ON p.layer_type = 'farmland'
      WHERE f.total_area < p.farmland_area_indicator
    """
  }
  
  # 检查各类建设用地面积总和是否不超过建设用地总规模
  Sql {
    source_table_name = "construction_area_stats,planning_indicators"
    result_table_name = "construction_validation_result"
    sql = """
      SELECT 
        'construction_total' as layer_type,
        SUM(c.total_area) as calculated_area,
        p.construction_area_limit as max_allowed_area,
        SUM(c.total_area) <= p.construction_area_limit as is_valid
      FROM construction_area_stats c
      JOIN planning_indicators p ON p.layer_type = 'construction'
      GROUP BY p.construction_area_limit
      HAVING SUM(c.total_area) > p.construction_area_limit
    """
  }
  
  # 检查耕地图上面积是否不小于规划指标中的耕地保有量
  Sql {
    source_table_name = "farmland_polygon_stats,planning_indicators"
    result_table_name = "farmland_polygon_validation_result"
    sql = """
      SELECT 
        f.layer_type,
        f.total_area as calculated_area,
        p.farmland_quota as required_area,
        f.total_area >= p.farmland_quota as is_valid
      FROM farmland_polygon_stats f
      JOIN planning_indicators p ON p.layer_type = 'farmland_quota'
      WHERE f.total_area < p.farmland_quota
    """
  }
  
  # 合并所有验证结果
  Sql {
    result_table_name = "final_validation_results"
    sql = """
      SELECT * FROM ecological_validation_result
      UNION ALL
      SELECT * FROM farmland_validation_result
      UNION ALL
      SELECT * FROM construction_validation_result
      UNION ALL
      SELECT * FROM farmland_polygon_validation_result
    """
  }
}

sink {
  # 输出验证结果到控制台
  ConsoleSink {
    source_table_name = "final_validation_results"
  }
  
  # 也可以输出到文件或其他存储系统
  # FileSink {
  #   source_table_name = "final_validation_results"
  #   path = "file://./data/validation_results.csv"
  #   format = "csv"
  # }
}