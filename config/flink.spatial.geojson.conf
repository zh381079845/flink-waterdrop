######
###### GeoJSON 读取 + 空间 UDF 示例
######

env {
  execution.parallelism = 1
  job.name = "geojson-spatial-area"
}

source {
  GeoJsonSource {
    path = "config/spatial_sample.geojson"
    result_table_name = "features"
  }
}

transform {
  SpatialUdfRegister {}
  sql {
    source_table_name = "features"
    result_table_name = "result_table"
    sql = """
      SELECT
        id,
        properties,
        geometry AS geom_wkt,
        st_astext(st_geomfromwkt(geometry)) AS normalized_wkt,
        st_area(geometry) AS area_m2
      FROM features
    """
  }
}

sink {
  ConsoleSink {}
}
