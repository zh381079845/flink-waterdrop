######
###### 小维表广播 + STRtree：适合红线/网格 × 海量事件点
######

env {
  execution.parallelism = 2
  job.name = "spatial-broadcast-strtree"
}

source {
  GeoJsonSource {
    path = "config/business/eco_redline.geojson"
    result_table_name = "eco_raw"
  }
  GeoJsonSource {
    path = "config/business/projects.geojson"
    result_table_name = "events"
  }
}

transform {
  SpatialBroadcastJoin {
    build_table = "eco_raw"
    probe_table = "events"
    build_key = "id"
    probe_key = "id"
    build_geom = "geometry"
    probe_geom = "geometry"
    result_table_name = "hits"
  }
}

sink {
  ConsoleSink {
    source_table_name = "hits"
  }
}
