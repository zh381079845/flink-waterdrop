######
###### 这个配置文件展示了如何在Waterdrop批处理模式中使用自定义UDF函数
######

env {
  # 设置Flink批处理环境
  execution.parallelism = 1
  job.name = "Waterdrop Batch UDF Demo"
}

source {
  # 使用文件源读取CSV数据
  FileSource {

    path = "/Users/zhanghongmac/Downloads/flink/flink-waterdrop/config/test.csv"
    format.type = "csv"
    schema = "[{\"type\":\"Int\"},{\"type\":\"string\"},{\"type\":\"string\"},{\"type\":\"Int\"}]"
    result_table_name = "books"
    field_name = "id,title,authors,years"
  }
}

transform {
  # 注册自定义UDF函数
  UdfRegister {
    udf_name = "str_len" # 可选，默认为"str_len"
  }
  
  # 使用SQL调用自定义UDF函数
  sql2 {
    source_table_name = "books"
    result_table_name = "result_table"
    sql = """
      SELECT 
        id,
        title, 
        authors,
        years,
        str_len(title) as title_length,
        str_len(authors) as author_name_length
      FROM books
    """
  }
}

sink {
  # 将结果输出到控制台
  ConsoleSink {}
} 