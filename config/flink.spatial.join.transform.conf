######
###### 产品化空间 JOIN：SpatialJoin 自动生成 grid + envelope + intersects
######

env {
  execution.parallelism = 1
  job.name = "spatial-join-transform"
}

source {
  GeoJsonSource {
    path = "config/business/eco_redline.geojson"
    result_table_name = "eco_raw"
  }
  GeoJsonSource {
    path = "config/business/farmland.geojson"
    result_table_name = "farm_raw"
  }
}

transform {
  SpatialJoin {
    left_table = "eco_raw"
    right_table = "farm_raw"
    left_geom = "geometry"
    right_geom = "geometry"
    left_key = "id"
    right_key = "id"
    cell_size = 0.05
    mode = "grid"
    predicate = "intersects"
    intersection_area = true
    dedup = true
    result_table_name = "conflicts"
  }
}

sink {
  ConsoleSink {
    source_table_name = "conflicts"
  }
}
