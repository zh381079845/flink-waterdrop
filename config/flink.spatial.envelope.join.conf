######
###### 空间 JOIN：先包络预过滤，再 st_intersects 精过滤
######

env {
  execution.parallelism = 1
  job.name = "spatial-envelope-join"
}

source {
  GeoJsonSource {
    path = "config/spatial_sample.geojson"
    result_table_name = "left_layer"
  }
  GeoJsonSource {
    path = "config/spatial_sample_right.geojson"
    result_table_name = "right_layer"
  }
}

transform {
  SpatialUdfRegister {}

  sql {
    source_table_name = "left_layer"
    result_table_name = "left_env"
    sql = """
      SELECT
        id,
        geometry,
        st_xmin(geometry) AS minx,
        st_xmax(geometry) AS maxx,
        st_ymin(geometry) AS miny,
        st_ymax(geometry) AS maxy
      FROM left_layer
    """
  }

  sql {
    source_table_name = "right_layer"
    result_table_name = "right_env"
    sql = """
      SELECT
        id,
        geometry,
        st_xmin(geometry) AS minx,
        st_xmax(geometry) AS maxx,
        st_ymin(geometry) AS miny,
        st_ymax(geometry) AS maxy
      FROM right_layer
    """
  }

  sql {
    result_table_name = "joined"
    sql = """
      SELECT
        l.id AS left_id,
        r.id AS right_id,
        st_intersects(l.geometry, r.geometry) AS hit
      FROM left_env l
      JOIN right_env r
        ON l.maxx >= r.minx AND l.minx <= r.maxx
       AND l.maxy >= r.miny AND l.miny <= r.maxy
       AND st_intersects(l.geometry, r.geometry)
    """
  }
}

sink {
  ConsoleSink {
    source_table_name = "joined"
  }
}
