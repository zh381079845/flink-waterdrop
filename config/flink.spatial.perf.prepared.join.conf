######
###### 性能优化推荐流水线：
######   1) SpatialMaterialize 物化 bounds + explode grid
######   2) SpatialJoin mode=prepared_grid（不再现场 st_xmin / st_grid_cells）
######

env {
  execution.parallelism = 2
  job.name = "spatial-perf-prepared-join"
}

source {
  GeoJsonSource {
    path = "config/business/eco_redline.geojson"
    result_table_name = "eco_raw"
  }
  GeoJsonSource {
    path = "config/business/farmland.geojson"
    result_table_name = "farm_raw"
  }
}

transform {
  SpatialMaterialize {
    source_table = "eco_raw"
    geom = "geometry"
    key = "id"
    cell_size = 0.05
    max_cells = 5000
    mode = "explode_grid"
    result_table_name = "eco_prep"
  }

  SpatialMaterialize {
    source_table = "farm_raw"
    geom = "geometry"
    key = "id"
    cell_size = 0.05
    max_cells = 5000
    mode = "explode_grid"
    result_table_name = "farm_prep"
  }

  SpatialJoin {
    left_table = "eco_prep"
    right_table = "farm_prep"
    left_geom = "geometry"
    right_geom = "geometry"
    left_key = "id"
    right_key = "id"
    # 已物化 bounds+grid_id：等价 mode=prepared_grid，跳过 st_xmin / LATERAL
    use_materialized_grid = true
    predicate = "intersects"
    intersection_area = true
    dedup = true
    result_table_name = "conflicts"
  }
}

sink {
  ConsoleSink {
    source_table_name = "conflicts"
  }
}
