######
###### 这个配置文件展示了如何在Waterdrop中使用自定义UDF函数
######

env {
  # 设置Flink流处理环境
  execution.parallelism = 1
  job.name = "Waterdrop UDF Demo"
  execution.runtime-mode = "streaming"
}

source {
  # 使用Fake数据源生成测试数据
  FakeSource {
    result_table_name = "fake_source"
    field_name = "name,age"
    row.num = 10
  }
}

transform {
  # 注册自定义UDF函数
  UdfRegister {
    udf_name = "str_len" # 可选，默认为"str_len"
  }
  
  # 使用SQL调用自定义UDF函数
  sql {
    source_table_name = "fake_source"
    result_table_name = "result_table"
    sql = """
      SELECT 
        name, 
        age, 
        str_len(name) as name_length,
        str_len(name, 0) as name_length_with_default
      FROM fake_source
    """
  }
}

sink {
  # 将结果输出到控制台
  ConsoleSink {}
} 