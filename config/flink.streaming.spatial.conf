######
###### 这个配置文件展示了如何在Waterdrop中使用空间UDF函数
######

env {
  # 设置Flink流处理环境
  execution.parallelism = 1
  job.name = "Waterdrop Spatial UDF Demo"
  execution.runtime-mode = "streaming"
}

source {
  # 使用Fake数据源生成测试数据
  FakeSource {
    result_table_name = "spatial_source"
    field_name = "id,name,wkt"
    row.num = 5
    
    # 设置WKT字段的值为几个点和线
    fields.wkt = [
      "POINT(116.397428 39.90923)",
      "POINT(121.473667 31.230525)",
      "LINESTRING(116.397428 39.90923, 121.473667 31.230525)",
      "POLYGON((116.397428 39.90923, 116.397428 40.90923, 117.397428 40.90923, 117.397428 39.90923, 116.397428 39.90923))",
      "MULTIPOINT((116.397428 39.90923), (121.473667 31.230525))"
    ]
  }
}

transform {
  # 注册空间UDF函数
  SpatialUdfRegister {
    buffer_udf_name = "st_buffer" # 可选，默认为"st_buffer"
  }
  
  # 使用SQL调用空间UDF函数
  sql {
    source_table_name = "spatial_source"
    result_table_name = "result_table"
    sql = """
      SELECT 
        id, 
        name,
        wkt AS original_geometry,
        st_buffer(wkt, 0.01) AS buffered_geometry_01km,
        st_buffer(wkt, 0.05) AS buffered_geometry_05km,
        st_buffer(wkt, 0.1, true) AS buffered_geometry_simple
      FROM spatial_source
    """
  }
}

sink {
  # 将结果输出到控制台
  ConsoleSink {}
} 