######
###### Sedona 风格两阶段空间 JOIN：
######   1) st_grid_cells 展开格子（等值 JOIN 可 shuffle）
######   2) 物化包络列做范围粗筛
######   3) st_intersects 精炼；可选 st_intersection + st_area 算占用
######
###### cellSize 单位：度。北京城区可试 0.02～0.1；省域可更大。
###### 点图层可只用 st_grid_id（单格），面图层用 st_grid_cells 展开。
######

env {
  execution.parallelism = 1
  job.name = "spatial-grid-envelope-join"
}

source {
  GeoJsonSource {
    path = "config/business/eco_redline.geojson"
    result_table_name = "eco_raw"
  }
  GeoJsonSource {
    path = "config/business/farmland.geojson"
    result_table_name = "farm_raw"
  }
}

transform {
  SpatialUdfRegister {}

  sql {
    result_table_name = "eco_grid"
    sql = """
      SELECT
        e.id,
        e.geometry,
        st_xmin(e.geometry) AS minx,
        st_xmax(e.geometry) AS maxx,
        st_ymin(e.geometry) AS miny,
        st_ymax(e.geometry) AS maxy,
        st_geohash(e.geometry, 5) AS geohash5,
        g.grid_id AS grid_id
      FROM eco_raw e,
      LATERAL TABLE(st_grid_cells(e.geometry, CAST(0.05 AS DOUBLE))) AS g(grid_id)
    """
  }

  sql {
    result_table_name = "farm_grid"
    sql = """
      SELECT
        f.id,
        f.geometry,
        st_xmin(f.geometry) AS minx,
        st_xmax(f.geometry) AS maxx,
        st_ymin(f.geometry) AS miny,
        st_ymax(f.geometry) AS maxy,
        g.grid_id AS grid_id
      FROM farm_raw f,
      LATERAL TABLE(st_grid_cells(f.geometry, CAST(0.05 AS DOUBLE))) AS g(grid_id)
    """
  }

  sql {
    result_table_name = "conflicts"
    sql = """
      SELECT
        e.id AS eco_id,
        f.id AS farm_id,
        MAX(st_area(st_intersection(e.geometry, f.geometry))) AS occupy_m2
      FROM eco_grid e
      JOIN farm_grid f
        ON e.grid_id = f.grid_id
       AND e.maxx >= f.minx AND e.minx <= f.maxx
       AND e.maxy >= f.miny AND e.miny <= f.maxy
       AND st_intersects(e.geometry, f.geometry)
      GROUP BY e.id, f.id
    """
  }
}

sink {
  ConsoleSink {
    source_table_name = "conflicts"
  }
}
